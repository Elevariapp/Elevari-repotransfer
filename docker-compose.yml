services:
  postgres:
    image: postgres:16-alpine
    container_name: wana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wana
      POSTGRES_PASSWORD: wana_dev_password
      POSTGRES_DB: wana
    ports:
      - "5432:5432"
    volumes:
      - wana_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wana -d wana"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wana-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wana_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Docker Hub's minio/minio is no longer published; Chainguard build pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    container_name: wana-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: wana_minio
      MINIO_ROOT_PASSWORD: wana_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wana_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The api creates the bucket and its public-read policy at startup (ensureBucket).

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: wana-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://wana:wana_dev_password@postgres:5432/wana?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: wana_minio
      MINIO_SECRET_KEY: wana_minio_password
      MINIO_BUCKET: wana-media
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: http://localhost:9000/wana-media
      MEDIA_AUTO_APPROVE: "true"
      JWT_SECRET: wana_dev_jwt_secret_change_in_production
      # ⚠️ SOLO para desarrollo local. Nunca reutilizar en producción.
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npm run dev"
    volumes:
      - ./api:/app
      - /app/node_modules

volumes:
  wana_pg_data:
  wana_redis_data:
  wana_minio_data:
