services:
  postgres:
    image: postgres:16-alpine
    container_name: elevari-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elevari
      POSTGRES_PASSWORD: elevari_dev_password
      POSTGRES_DB: elevari
    ports:
      - "5432:5432"
    volumes:
      - elevari_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevari -d elevari"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: elevari-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - elevari_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Same pinned Chainguard build as production (Docker Hub's minio/minio is no longer published).
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    container_name: elevari-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: elevari_minio
      MINIO_ROOT_PASSWORD: elevari_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - elevari_minio_data:/data

  # The api creates the bucket and its public-read policy at startup (ensureBucket).

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: elevari-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://elevari:elevari_dev_password@postgres:5432/elevari?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: elevari_minio
      MINIO_SECRET_KEY: elevari_minio_password
      MINIO_BUCKET: elevari-media
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: http://localhost:9000/elevari-media
      MEDIA_AUTO_APPROVE: "true"
      JWT_SECRET: elevari_dev_jwt_secret_change_in_production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npm run dev"
    volumes:
      - ./api:/app
      - /app/node_modules

volumes:
  elevari_pg_data:
  elevari_redis_data:
  elevari_minio_data:
