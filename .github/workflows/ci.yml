name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          JWT_SECRET: ci_jwt_secret_min_32_chars_for_build_only

  validate-staging-env:
    name: Validate staging env template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create staging env from example
        run: |
          cp deploy/.env.staging.example .env.staging
          sed -i 's/change_me_jwt_min_32_chars/ci_staging_jwt_secret_min_32_chars_x/g' .env.staging
          sed -i 's/^POSTGRES_PASSWORD=change_me$/POSTGRES_PASSWORD=staging_pg_password_123/' .env.staging
          sed -i 's/change_me_minio/staging_minio_secret_123/g' .env.staging
      - run: STAGING=1 ./deploy/scripts/validate-env.sh

  verification-log:
    name: Verification log gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy/scripts/check-verification-log.sh verification-log.md

  mobile-typecheck:
    name: Mobile TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck

  mobile-build-android:
    name: Mobile Android build (production)
    runs-on: ubuntu-latest
    needs: mobile-typecheck
    if: github.ref == 'refs/heads/b-main' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: EAS login
        run: eas login --non-interactive --token ${{ secrets.EXPO_TOKEN }}
      - name: Build Android (production)
        run: eas build --platform android --profile production --non-interactive
