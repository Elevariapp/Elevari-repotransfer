name: CI

on:
  push:
    branches: [main, master, b-main]
  pull_request:
    branches: [main, master, b-main]
  workflow_dispatch:

# Cancel superseded runs (saves minutes). Deploys are protected by their own group below.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  workflow-lint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  api:
    name: API build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'hooks/**', 'content/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --no-audit --no-fund
      - name: Scene outputs are up to date
        run: npm run scene:check
      - name: Fonts are self-hosted
        run: |
          if git grep -n "next/font/google" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs'; then
            echo "::error::next/font/google downloads fonts while building and broke the Hetzner deploy. Self-host with next/font/local (app/fonts)."
            exit 1
          fi
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          JWT_SECRET: ci_jwt_secret_min_32_chars_for_build_only
      # The Dockerfile ships `next build --webpack` with type errors ignored (small VPS), while the build
      # above is Turbopack. Without this step a webpack-only failure only shows up on the server, mid-deploy.
      - name: Production build (webpack, as in the Dockerfile)
        run: npx next build --webpack
        env:
          NEXT_IGNORE_TYPE_ERRORS: '1'
          NODE_OPTIONS: --max-old-space-size=1536
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          JWT_SECRET: ci_jwt_secret_min_32_chars_for_build_only

  bot:
    name: WhatsApp bot check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: elevari-bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: elevari-bot/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Smoke test /health
        run: |
          PORT=3999 node src/index.js &
          pid=$!
          trap 'kill $pid' EXIT
          for _ in $(seq 1 10); do
            curl -sf http://127.0.0.1:3999/health && exit 0
            sleep 1
          done
          echo "bot did not become healthy"; exit 1

  validate-staging-env:
    name: Validate staging env template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create staging env from example
        run: |
          cp deploy/.env.staging.example .env.staging
          sed -i 's/change_me_jwt_min_32_chars/ci_staging_jwt_secret_min_32_chars_x/g' .env.staging
          sed -i 's/^POSTGRES_PASSWORD=change_me$/POSTGRES_PASSWORD=staging_pg_password_123/' .env.staging
          sed -i 's/change_me_minio/staging_minio_secret_123/g' .env.staging
      - run: STAGING=1 ./deploy/scripts/validate-env.sh
      - name: Validate production compose file (web + api + bot + nginx)
        run: |
          cp deploy/.env.production.example .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config -q

  verification-log:
    name: Verification log gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - run: ./deploy/scripts/check-verification-log.sh verification-log.md

  mobile-typecheck:
    name: Mobile TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Expo SDK 58 / RN 0.88 require Node >= 22.13
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck

  # Only runs when mobile/ changed (or manual dispatch) to avoid burning EAS builds and minutes.
  # --no-wait queues the build on EAS; the APK/AAB is downloadable from expo.dev.
  mobile-build-android:
    name: Mobile Android build (EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [mobile-typecheck, changes]
    if: >-
      (github.ref == 'refs/heads/b-main' || github.ref == 'refs/heads/main') &&
      (needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch')
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - name: Check EXPO_TOKEN and EAS project
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN secret not set — skipping EAS build"
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif ! grep -qE '"projectId": *"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"' app.json; then
            echo "::warning::mobile/app.json extra.eas.projectId is not an EAS UUID — run 'npx eas-cli init' in mobile/ and commit it. Skipping EAS build"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install EAS CLI
        if: steps.token.outputs.present == 'true'
        run: npm install -g eas-cli
      - name: Queue Android build (production AAB)
        if: steps.token.outputs.present == 'true'
        run: eas build --platform android --profile production --non-interactive --no-wait
      - name: Queue Android APK (preview, sideload/internal testing)
        if: steps.token.outputs.present == 'true'
        run: eas build --platform android --profile preview --non-interactive --no-wait

  deploy-production:
    name: Deploy to Hetzner Production (web + api + bot)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [workflow-lint, api, web, bot, validate-staging-env, verification-log, mobile-typecheck]
    if: github.ref == 'refs/heads/b-main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Never run two deploys at once, and never cancel one halfway through a docker build.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HETZNER_IP: ${{ secrets.HETZNER_IP || vars.HETZNER_IP }}
      HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      META_APP_ID: ${{ secrets.META_APP_ID || '1045490988562190' }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET || secrets.facebook_Key }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.WHATSAPP_TOKEN }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID || '1705399497596090' }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET || secrets.facebook_Key }}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
    steps:
      - name: Check deploy secrets
        id: secrets
        run: |
          missing=""
          for v in HETZNER_IP HETZNER_USER HETZNER_SSH_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Deploy secrets missing::Add repository secret(s):$missing (Settings → Secrets and variables → Actions). See deploy/DEPLOYMENT_PRODUCTION.md"
            exit 1
          fi
          # Non-secret diagnostics: lets you compare against `ssh-keygen -lf <your key>` locally.
          printf '%s\n' "$HETZNER_SSH_KEY" | tr -d '\r' > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          echo "user-is-root: $([ "$HETZNER_USER" = root ] && echo yes || echo NO)  user-length: ${#HETZNER_USER}  ip-length: ${#HETZNER_IP}"
          if ssh-keygen -y -f /tmp/deploy_key >/tmp/deploy_key.pub 2>/dev/null; then
            echo "key fingerprint: $(ssh-keygen -lf /tmp/deploy_key.pub)"
          else
            echo "::error title=HETZNER_SSH_KEY invalid::The secret is not a valid private key. Paste the whole file, including the BEGIN/END lines."
            exit 1
          fi
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::notice title=Resend secret not set::RESEND_API_KEY is not configured in repository Actions secrets."
          fi
          rm -f /tmp/deploy_key /tmp/deploy_key.pub
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.HETZNER_IP }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ env.HETZNER_SSH_KEY }}
          envs: RESEND_API_KEY,META_APP_ID,META_APP_SECRET,META_ACCESS_TOKEN,WHATSAPP_TOKEN,WHATSAPP_PHONE_NUMBER_ID,WHATSAPP_VERIFY_TOKEN,WHATSAPP_APP_SECRET,WHATSAPP_BUSINESS_ACCOUNT_ID
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/elevari
            echo "→ Syncing code to origin/b-main..."
            git fetch --prune origin b-main
            git reset --hard origin/b-main
            chmod +x deploy/scripts/*.sh
            python3 - <<'PY'
            import os
            from pathlib import Path

            path = Path(".env.production")
            if not path.exists():
                raise SystemExit(".env.production is missing on the production server")

            managed_keys = (
                "RESEND_API_KEY",
                "META_APP_ID",
                "META_APP_SECRET",
                "META_ACCESS_TOKEN",
                "WHATSAPP_TOKEN",
                "WHATSAPP_PHONE_NUMBER_ID",
                "WHATSAPP_VERIFY_TOKEN",
                "WHATSAPP_APP_SECRET",
                "WHATSAPP_BUSINESS_ACCOUNT_ID",
            )
            managed_values = {
                key: os.environ.get(key, "").strip()
                for key in managed_keys
            }
            lines = path.read_text().splitlines()
            quoted = []
            found_keys = set()
            updated_keys = []

            for line in lines:
                if not line or line.lstrip().startswith("#") or "=" not in line:
                    quoted.append(line)
                    continue

                key, value = line.split("=", 1)
                if key in managed_values and managed_values[key]:
                    value = managed_values[key]
                    found_keys.add(key)
                    updated_keys.append(key)
                elif key in managed_values and not value.strip():
                    continue

                value = value.strip()
                if len(value) >= 2 and value[0] == value[-1] and value[0] in ("'", '"'):
                    value = value[1:-1]
                value = value.replace("\\", "\\\\").replace("'", "'\"'\"'")
                quoted.append(f"{key}='{value}'")

            for key in managed_keys:
                value = managed_values[key]
                if value and key not in found_keys:
                    value = value.replace("\\", "\\\\").replace("'", "'\"'\"'")
                    quoted.append(f"{key}='{value}'")
                    updated_keys.append(key)

            path.write_text("\n".join(quoted) + "\n")
            path.chmod(0o600)
            print("Managed production keys updated:", ", ".join(sorted(set(updated_keys))) or "none")
            PY
            if [[ -n "${RESEND_API_KEY:-}" ]]; then
              echo "→ RESEND_API_KEY updated on the production server"
            else
              echo "→ RESEND_API_KEY was not supplied; keeping the server's existing value"
            fi
            echo "→ Production env keys:"
            awk -F= 'NF >= 2 {print $1}' .env.production | paste -sd, -
            echo "→ Validating production environment..."
            ./deploy/scripts/validate-env.sh
            echo "→ Building and deploying Docker stack (web, api, bot, nginx)..."
            ./deploy/scripts/deploy-prod.sh
            echo "✓ Deploy to elevari.live completed successfully"

      # -----------------------------------------------------------------------
      # NEW: Purge Cloudflare cache after a successful production deploy so
      # visitors never get stale HTML/assets from the edge.
      # -----------------------------------------------------------------------
      - name: Purge Cloudflare cache (post-deploy)
        if: always()
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ZONE_ID }}" ]; then
            echo "::notice title=Cloudflare cache purge skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ZONE_ID not set. Add them in Settings → Secrets and variables → Actions to auto-purge after deploy."
            exit 0
          fi
          chmod +x deploy/scripts/cloudflare-purge.sh
          ./deploy/scripts/cloudflare-purge.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_DOMAIN: elevari.live
