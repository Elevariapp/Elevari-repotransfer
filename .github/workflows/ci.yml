name: CI

on:
  push:
    branches: [b-main, main, 'chore/**']
  pull_request:
    branches: [b-main, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run build

  web:
    name: Web typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # Unreachable API on purpose: the build must not depend on a running backend.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:1
          NEXT_PUBLIC_SITE_URL: https://elevari.live
          JWT_SECRET: ci_jwt_secret_min_32_chars_for_build_only

  docker-build:
    name: Production images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -t elevari-api ./api
      - name: Build web image
        run: |
          docker build -t elevari-web \
            --build-arg NEXT_PUBLIC_API_URL=https://elevari.live \
            --build-arg NEXT_PUBLIC_SITE_URL=https://elevari.live .

  validate-production-env:
    name: Validate production env template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill the template with throw-away CI values
        run: |
          cp deploy/.env.production.example .env.production
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_pg_password_123/' .env.production
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci_jwt_secret_min_32_chars_for_validation_only/' .env.production
          sed -i 's/^MINIO_SECRET_KEY=.*/MINIO_SECRET_KEY=ci_minio_secret_123456/' .env.production
          sed -i 's/^WOMPI_PUBLIC_KEY=.*/WOMPI_PUBLIC_KEY=pub_prod_ci/' .env.production
          sed -i 's/^NEXT_PUBLIC_WOMPI_PUBLIC_KEY=.*/NEXT_PUBLIC_WOMPI_PUBLIC_KEY=pub_prod_ci/' .env.production
          sed -i 's/^WOMPI_PRIVATE_KEY=.*/WOMPI_PRIVATE_KEY=prv_prod_ci/' .env.production
          sed -i 's/^WOMPI_EVENTS_SECRET=.*/WOMPI_EVENTS_SECRET=prod_events_ci/' .env.production
          sed -i 's/^WOMPI_INTEGRITY_SECRET=.*/WOMPI_INTEGRITY_SECRET=prod_integrity_ci/' .env.production
          sed -i 's/^ALEGRA_EMAIL=.*/ALEGRA_EMAIL=ci@example.com/' .env.production
          sed -i 's/^ALEGRA_API_TOKEN=.*/ALEGRA_API_TOKEN=ci_token/' .env.production
          sed -i 's/^RESEND_API_KEY=.*/RESEND_API_KEY=re_ci/' .env.production
          sed -i 's/^TURNSTILE_SECRET_KEY=.*/TURNSTILE_SECRET_KEY=ci_turnstile_secret/' .env.production
      - run: bash ./deploy/scripts/validate-env.sh
      - name: Compose file must be valid and every service healthcheck defined
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.production config -q
          docker compose -f docker-compose.prod.yml --env-file .env.production config --format json \
            | python3 -c "import json,sys; c=json.load(sys.stdin)['services']; missing=[n for n in ('api','web') if 'healthcheck' not in c[n]]; sys.exit('missing healthcheck: %s' % missing) if missing else print('healthchecks ok')"

  docs-lint:
    name: Canonical docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run docs:lint

  verification-log:
    name: Verification log gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ./deploy/scripts/check-verification-log.sh verification-log.md

  mobile-typecheck:
    name: Mobile TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # The Expo dependency tree has an upstream react/react-dom peer mismatch; the lockfile is generated with this flag.
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
