name: CI

on:
  push:
    branches: [main, master, b-main]
  pull_request:
    branches: [main, master, b-main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          JWT_SECRET: ci_jwt_secret_min_32_chars_for_build_only

  validate-staging-env:
    name: Validate staging env template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create staging env from example
        run: |
          cp deploy/.env.staging.example .env.staging
          sed -i 's/change_me_jwt_min_32_chars/ci_staging_jwt_secret_min_32_chars_x/g' .env.staging
          sed -i 's/^POSTGRES_PASSWORD=change_me$/POSTGRES_PASSWORD=staging_pg_password_123/' .env.staging
          sed -i 's/change_me_minio/staging_minio_secret_123/g' .env.staging
      - run: STAGING=1 ./deploy/scripts/validate-env.sh

  verification-log:
    name: Verification log gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy/scripts/check-verification-log.sh verification-log.md

  mobile-typecheck:
    name: Mobile TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck

  mobile-build-android:
    name: Mobile Android build (production)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: mobile-typecheck
    if: (github.ref == 'refs/heads/b-main' || github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: EAS login
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: eas login --non-interactive --token ${{ secrets.EXPO_TOKEN }}
      - name: Build Android (production)
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: eas build --platform android --profile production --non-interactive --no-wait
      - name: Upload Android build artifacts
        if: ${{ secrets.EXPO_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            mobile/*.aab
            mobile/*.apk
          retention-days: 30
      - name: Submit to Play Store Internal Testing
        if: ${{ secrets.EXPO_TOKEN != '' && secrets.GOOGLE_PLAY_SERVICE_ACCOUNT != '' }}
        run: eas submit --platform android --track internal --non-interactive

  whatsapp-bot:
    name: WhatsApp Bot syntax + health check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: elevari-bot/package-lock.json
      - name: Install bot dependencies
        working-directory: elevari-bot
        run: npm ci
      - name: Check bot syntax
        working-directory: elevari-bot
        run: node --check src/index.js
      - name: Start bot and hit /health
        working-directory: elevari-bot
        run: |
          cp .env.example .env 2>/dev/null || true
          node src/index.js &
          BOT_PID=$!
          sleep 3
          if curl -sf http://localhost:3001/bot/health >/dev/null 2>&1; then
            echo "✓ Bot /health check passed"
          else
            echo "✗ Bot /health check failed"
            kill $BOT_PID 2>/dev/null || true
            exit 1
          fi
          kill $BOT_PID 2>/dev/null || true

  deploy-production:
    name: Deploy to Hetzner Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, web, validate-staging-env, verification-log, mobile-typecheck, mobile-build-android, whatsapp-bot]
    if: github.ref == 'refs/heads/b-main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/elevari
            echo "→ Pulling latest code from b-main..."
            git pull origin b-main
            echo "→ Validating production environment..."
            npm run go-live:validate
            echo "→ Building and deploying Docker stack..."
            npm run go-live:deploy
            echo "→ Running health checks..."
            curl -sf http://localhost/health && echo "✓ API health OK" || (echo "✗ API health failed" && exit 1)
            curl -sf http://localhost/bot/health && echo "✓ Bot health OK" || (echo "✗ Bot health failed" && exit 1)
            echo "✓ Deploy to elevari.live completed successfully"
