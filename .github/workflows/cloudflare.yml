---
name: Cloudflare operations

# Runs on every push to b-main (after deploy) and manually via Actions tab.
# All jobs are read-only or cache-purge only — no secrets are printed.
on:
  push:
    branches: [b-main]
  workflow_dispatch:
    inputs:
      purge_cache:
        description: 'Purge Cloudflare cache (purge_everything)'
        type: boolean
        default: true
      validate_dns:
        description: 'Validate DNS + SSL + origin reachability'
        type: boolean
        default: true

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_DOMAIN: elevari.live
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Gate: ensure required secrets exist before doing anything
  # ---------------------------------------------------------------------------
  secrets-check:
    name: Check Cloudflare secrets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      account_ready: ${{ steps.check.outputs.account_ready }}
    steps:
      - id: check
        run: |
          missing=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ZONE_ID }}" ] && missing="$missing CLOUDFLARE_ZONE_ID"
          if [ -n "$missing" ]; then
            echo "::notice title=Cloudflare secrets not configured::$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          # CLOUDFLARE_ACCOUNT_ID es opcional para purge/validate, pero obligatorio para wrangler deploy --env staging
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::notice title=Cloudflare Account ID missing::CLOUDFLARE_ACCOUNT_ID not set. wrangler deploy --env staging will be skipped."
            echo "account_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "account_ready=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Purge Cloudflare cache after a successful deploy
  # ---------------------------------------------------------------------------
  purge-cache:
    name: Purge Cloudflare cache
    needs: secrets-check
    if: >-
      needs.secrets-check.outputs.ready == 'true' &&
      (github.event_name == 'push' || github.event.inputs.purge_cache == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge cache via API
        run: |
          chmod +x deploy/scripts/cloudflare-purge.sh
          ./deploy/scripts/cloudflare-purge.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_DOMAIN: ${{ env.CLOUDFLARE_DOMAIN }}

  # ---------------------------------------------------------------------------
  # Validate DNS, SSL/TLS, and that Cloudflare reaches the origin
  # ---------------------------------------------------------------------------
  validate-dns-ssl:
    name: Validate DNS + SSL + origin
    needs: secrets-check
    if: >-
      needs.secrets-check.outputs.ready == 'true' &&
      (github.event_name == 'push' || github.event.inputs.validate_dns == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS records via Cloudflare API
        id: dns
        run: |
          chmod +x deploy/scripts/cloudflare-dns-list.sh
          ./deploy/scripts/cloudflare-dns-list.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - name: SSL/TLS certificate edge dates
        run: |
          echo "→ Edge certificate presented by Cloudflare"
          echo | openssl s_client -connect "${CLOUDFLARE_DOMAIN}:443" -servername "${CLOUDFLARE_DOMAIN}" 2>/dev/null \
            | openssl x509 -noout -issuer -subject -dates 2>&1 | sed 's/^/   /'
      - name: cf-cache-status on home page
        run: |
          echo "→ Edge cache status for https://${CLOUDFLARE_DOMAIN}/"
          curl -sS -I --max-time 30 "https://${CLOUDFLARE_DOMAIN}/" \
            | grep -iE '^(cf-cache-status|cf-ray|server|age):' | sed 's/^/   /'
      - name: Origin reachability through Cloudflare
        run: |
          TAG="ci-$(date +%s)"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://${CLOUDFLARE_DOMAIN}/health?ci-tag=${TAG}")
          echo "   /health through Cloudflare -> HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::warning::Origin health check through Cloudflare returned HTTP ${code} (expected 200)"
          fi

  # ---------------------------------------------------------------------------
  # Post-deploy: verify the new build is what visitors actually receive
  # ---------------------------------------------------------------------------
  verify-deploy:
    name: Verify live deploy through Cloudflare
    needs: [secrets-check, purge-cache]
    if: >-
      needs.secrets-check.outputs.ready == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/b-main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check html lang + cache status via Cloudflare
        run: |
          echo "→ Verifying live site through Cloudflare edge"
          headers=$(curl -sS -D - -o /tmp/body.html --max-time 30 "https://${CLOUDFLARE_DOMAIN}/")
          echo "$headers" | grep -iE '^(cf-cache-status|cf-ray):' | sed 's/^/   /'
          lang=$(grep -oiE '<html[^>]*\blang=[a-z]{2}' /tmp/body.html | head -1 | grep -oiE '[a-z]{2}' || echo 'none')
          echo "   <html lang> = ${lang}"
          if [ "$lang" != "es" ] && [ "$lang" != "en" ]; then
            echo "::warning::Unexpected or missing <html lang> (${lang}) — new i18n build may not be live"
          fi
          rm -f /tmp/body.html

  # ---------------------------------------------------------------------------
  # Deploy staging Worker to Cloudflare (requires CLOUDFLARE_ACCOUNT_ID)
  # Only runs when the secret has been added to GitHub repository secrets.
  # ---------------------------------------------------------------------------
  deploy-staging-worker:
    name: Deploy staging Worker (wrangler)
    needs: secrets-check
    if: >-
      needs.secrets-check.outputs.account_ready == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Deploy staging Worker
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
