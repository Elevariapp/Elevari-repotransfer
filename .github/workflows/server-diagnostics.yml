name: Server diagnostics

# Manual and read-only: Actions → Server diagnostics → Run workflow.
# This repository is public, so its logs are public: nothing here prints env files, tokens or the server IP.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-view:
    name: Public view (DNS, registration, Cloudflare, HTTPS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOMAIN: elevari.live
      ORIGIN_IP: '2.29.165.225'
    steps:
      - name: DNS and domain registration
        run: |
          set +e
          doh() { curl -sS -m 15 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$1&type=$2"; }
          { curl -sS -m 15 https://www.cloudflare.com/ips-v4; echo; curl -sS -m 15 https://www.cloudflare.com/ips-v6; echo; } > /tmp/cf-ips.txt
          cat > /tmp/classify.py <<'PY'
          import ipaddress, os, sys
          nets = [ipaddress.ip_network(l.strip()) for l in open('/tmp/cf-ips.txt') if l.strip()]
          origin = os.environ.get('ORIGIN_IP', '')
          for ip in sys.argv[1:]:
              a = ipaddress.ip_address(ip)
              if ip == origin:
                  kind = 'your Hetzner server (DNS only, not proxied by Cloudflare)'
              elif any(a in n for n in nets):
                  kind = 'Cloudflare proxy'
              else:
                  kind = 'NOT Cloudflare and NOT your Hetzner server'
              print(ip if ip != origin else '<origin-ip>', '->', kind)
          PY
          echo "== DNS as the public internet sees it"
          for h in "$DOMAIN" "www.$DOMAIN" "app.$DOMAIN" "api.$DOMAIN"; do
            r=$(doh "$h" A)
            echo "-- $h  (DNS status $(echo "$r" | jq -r '.Status // "error"'); 0 = ok, 3 = name does not exist)"
            ips=$(echo "$r" | jq -r '.Answer[]? | select(.type==1) | .data')
            if [ -z "$ips" ]; then echo "   no A record"; else printf '%s\n' "$ips" | xargs python3 /tmp/classify.py | sed 's/^/   /'; fi
          done
          echo "-- Nameservers: $(doh "$DOMAIN" NS | jq -r '[.Answer[]? | select(.type==2) | .data] | join(", ")')"
          echo
          echo "== Domain registration (RDAP)"
          for u in "https://rdap.identitydigital.services/rdap/domain/$DOMAIN" "https://rdap.org/domain/$DOMAIN"; do
            if curl -sSL -m 20 -o /tmp/rdap.json "$u" && jq -e . /tmp/rdap.json >/dev/null 2>&1; then
              jq -r '"   status: \((.status // []) | join(", "))", ((.events // [])[] | "   \(.eventAction): \(.eventDate)"), "   nameservers: \([(.nameservers // [])[].ldhName] | join(", "))"' /tmp/rdap.json
              break
            fi
          done

      - name: What visitors get over HTTPS
        run: |
          set +e
          mask() { if [ -n "$ORIGIN_IP" ]; then sed "s/${ORIGIN_IP//./\\.}/<origin-ip>/g"; else cat; fi; }
          for u in "https://$DOMAIN/" "https://www.$DOMAIN/" "https://app.$DOMAIN/" "https://api.$DOMAIN/health"; do
            echo "-- $u"
            : > /tmp/head.txt; : > /tmp/body.html
            curl -sS -m 25 -o /tmp/body.html -D /tmp/head.txt -w "   result: HTTP %{http_code} in %{time_total}s\n" "$u" 2>&1 | mask
            tr -d '\r' < /tmp/head.txt | grep -iE '^(server|cf-ray|location|cf-cache-status):' | sed 's/^/   /'
            grep -oiE 'error (code )?[0-9]{3,4}[^<]{0,60}' /tmp/body.html | head -2 | sed 's/^/   page says: /'
          done
          echo "-- TLS certificate presented for $DOMAIN"
          echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null | openssl x509 -noout -issuer -dates 2>&1 | sed 's/^/   /'

      - name: Why Cloudflare answers what it answers
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          show() {
            : > /tmp/head.txt; : > /tmp/body.html
            curl -sS -m 25 "$@" -o /tmp/body.html -D /tmp/head.txt -w "   HTTP %{http_code}\n" 2>&1
            tr -d '\r' < /tmp/head.txt | grep -viE '^(set-cookie|report-to|nel):' | sed 's/^/   | /'
            printf '   title: %s\n' "$(grep -oiE '<title>[^<]*</title>' /tmp/body.html | head -1)"
            printf '   text:  %s\n' "$(sed -e 's/<[^>]*>/ /g' /tmp/body.html | tr -s ' \n\t' ' ' | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g' | cut -c1-300)"
          }
          echo "== curl User-Agent -> https://$DOMAIN/";             show "https://$DOMAIN/"
          echo "== Browser User-Agent -> https://$DOMAIN/";          show -A "$UA" -H 'Accept: text/html,application/xhtml+xml' -H 'Accept-Language: es-CO,es;q=0.9' "https://$DOMAIN/"
          echo "== Plain HTTP -> http://$DOMAIN/";                   show -A "$UA" "http://$DOMAIN/"
          echo "== Browser User-Agent -> https://$DOMAIN/robots.txt"; show -A "$UA" "https://$DOMAIN/robots.txt"

      - name: Straight to the origin server (bypassing Cloudflare)
        run: |
          set +e
          if [ -z "$ORIGIN_IP" ]; then echo "HETZNER_IP is not set"; exit 0; fi
          mask() { sed "s/${ORIGIN_IP//./\\.}/<origin-ip>/g"; }
          for p in 22 80 443; do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$ORIGIN_IP/$p" 2>/dev/null; then echo "port $p: OPEN"; else echo "port $p: closed or filtered (seen from GitHub's network)"; fi
          done
          curl -sS -m 12 -o /dev/null -w "http://origin/ with Host: $DOMAIN -> HTTP %{http_code}\n" -H "Host: $DOMAIN" "http://$ORIGIN_IP/" 2>&1 | mask
          curl -sSk -m 12 -o /dev/null -w "https://origin/ (TLS on 443) -> HTTP %{http_code}\n" --resolve "$DOMAIN:443:$ORIGIN_IP" "https://$DOMAIN/" 2>&1 | mask

  server:
    name: Server inside (containers, nginx, ports)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HETZNER_IP: '2.29.165.225'
      HETZNER_USER: 'root'
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
    steps:
      - name: Read-only checks over SSH
        run: |
          set +e
          for v in HETZNER_IP HETZNER_USER HETZNER_SSH_KEY; do
            [ -z "${!v}" ] && { echo "::error::$v is not set"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" | tr -d '\r' > ~/.ssh/diag_key
          chmod 600 ~/.ssh/diag_key
          ssh -i ~/.ssh/diag_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o LogLevel=ERROR \
            "$HETZNER_USER@$HETZNER_IP" 'bash -s' <<'REMOTE'
          export LC_ALL=C
          mask() { sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g; s/[A-Za-z0-9+\/_=-]{32,}/<redacted>/g' | cut -c1-240; }
          echo "== host"
          echo "uptime: $(uptime -p)"
          free -m | awk 'NR==2{printf "memory: %s MB used of %s MB\n",$3,$2}'
          df -h / | awk 'NR==2{print "disk: "$3" used of "$2" ("$5")"}'
          echo "docker service: $(systemctl is-active docker)"
          cd /opt/elevari 2>/dev/null || { echo "/opt/elevari does not exist"; exit 0; }
          echo "repo: $(git rev-parse --short HEAD) - $(git log -1 --format=%s | cut -c1-80)"
          echo
          echo "== every container on the host"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo
          echo "== restart counts and health"
          for c in $(docker ps -aq); do
            docker inspect -f '{{.Name}} state={{.State.Status}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c"
          done
          echo
          echo "== who listens on 80/443 (host)"
          ss -tlnpH | awk '$4 ~ /:(80|443)$/ {print $4, $6}' | cut -c1-120
          echo
          echo "== checks made from the server itself"
          for p in /health / /bot/health; do
            curl -sS -m 8 -o /dev/null -w "http://127.0.0.1$p -> HTTP %{http_code}\n" -H 'Host: elevari.live' "http://127.0.0.1$p" 2>&1 | head -1
          done
          curl -sk -m 8 -o /dev/null -w "https://127.0.0.1/ -> HTTP %{http_code} (000 = nothing serves TLS on 443)\n" https://127.0.0.1/
          echo
          echo "== host firewall (ports only)"
          if command -v ufw >/dev/null; then ufw status | head -1; ufw status | awk '$1 ~ /^(80|443|22)(\/|$)/ {print $1, $2}'; else echo "ufw not installed"; fi
          echo
          echo "== nginx config test"
          docker exec "$(docker compose -f docker-compose.prod.yml --env-file .env.production ps -q nginx)" nginx -t 2>&1 | mask
          echo
          echo "== visitor requests nginx has received (public IPs only, curl probes excluded, no IPs or query strings)"
          NG=$(docker compose -f docker-compose.prod.yml --env-file .env.production ps -q nginx)
          echo "nginx container started: $(docker inspect -f '{{.State.StartedAt}}' "$NG")"
          ext=$(docker logs "$NG" 2>&1 | grep -E '^[0-9a-f:.]+ - ' | grep -vE '^(127\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)' | grep -v 'curl/')
          echo "requests: $(printf '%s\n' "$ext" | grep -c .)"
          printf '%s\n' "$ext" | awk 'NF {print $9}' | sort | uniq -c | sed 's/^/  status /'
          printf '%s\n' "$ext" | tail -8 | awk 'NF {split($7,p,"?"); print "  " substr($4,2), substr($6,2), p[1], "->", $9}'
          echo
          echo "== recent error lines per service (IPs and tokens masked)"
          for s in nginx web api bot; do
            echo "-- $s"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --no-color --tail 300 "$s" 2>&1 | grep -iE 'error|fatal|emerg|crit|unhandled|econn|eaddr|denied' | tail -8 | mask
          done
          REMOTE
          rc=$?
          rm -f ~/.ssh/diag_key
          [ $rc -eq 0 ] || echo "::error::SSH step ended with exit code $rc"
          exit $rc

  origin-trace:
    name: Does Cloudflare reach OUR server?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOMAIN: elevari.live
      HETZNER_IP: '2.29.165.225'
      HETZNER_USER: 'root'
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
    steps:
      - name: Send tagged requests through Cloudflare, then look for the tag in nginx
        run: |
          set +e
          for v in HETZNER_IP HETZNER_USER HETZNER_SSH_KEY; do
            [ -z "${!v}" ] && { echo "::error::$v is not set"; exit 1; }
          done
          TAG="diag$(date +%s)$RANDOM"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          for path in / /health /bot/health; do
            curl -sS -m 25 -A "$UA" -o /dev/null -w "through Cloudflare: https://$DOMAIN$path -> HTTP %{http_code}\n" "https://$DOMAIN$path?$TAG=1" 2>&1
          done
          sleep 3
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" | tr -d '\r' > ~/.ssh/trace_key
          chmod 600 ~/.ssh/trace_key
          out=$(ssh -i ~/.ssh/trace_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o LogLevel=ERROR \
            "$HETZNER_USER@$HETZNER_IP" "cd /opt/elevari && docker logs \$(docker compose -f docker-compose.prod.yml --env-file .env.production ps -q nginx) 2>&1 | grep -F '$TAG'")
          rm -f ~/.ssh/trace_key
          echo
          echo "nginx on your server saw $(printf '%s\n' "$out" | grep -c .) of the 3 tagged requests:"
          printf '%s\n' "$out" | awk 'NF {split($1,ip,"."); split($7,p,"?"); print "  from " ip[1] "." ip[2] ".x.x  " p[1] " -> " $9}'
          if [ -z "$out" ]; then
            echo "RESULT: Cloudflare is NOT sending $DOMAIN to this server. Its origin for the record is somewhere else."
          else
            echo "RESULT: Cloudflare reaches this server."
          fi

  whatsapp-bot:
    name: WhatsApp bot (does Meta reach it, does it answer?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOMAIN: elevari.live
    steps:
      - uses: actions/checkout@v7

      - name: Tag this run's test requests
        run: echo "TAG=diag$(date +%s)$RANDOM" >> "$GITHUB_ENV"

      # No secrets: the same two requests Meta makes (webhook verification and a message), refused by the bot on purpose.
      - name: Who answers at the webhook, the bot or Cloudflare?
        run: bash .github/scripts/whatsapp-diagnostics/public-probe.sh | tee "$RUNNER_TEMP/whatsapp-1-public.txt"

      # Read-only. server-report.py reads the nginx and bot logs; meta-check.js runs inside the bot container and asks
      # Meta (GET only) about the token, the phone number and the webhook the bot is using. Neither prints a value.
      - name: What reached the server, what the bot did, what Meta has on file
        env:
          HETZNER_IP: '2.29.165.225'
          HETZNER_USER: 'root'
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set +e
          for v in HETZNER_IP HETZNER_USER HETZNER_SSH_KEY; do
            [ -z "${!v}" ] && { echo "::error::$v is not set"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" | tr -d '\r' > ~/.ssh/bot_key
          chmod 600 ~/.ssh/bot_key
          on_server() {
            ssh -i ~/.ssh/bot_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o LogLevel=ERROR \
              "$HETZNER_USER@$HETZNER_IP" "$@"
          }
          # Last line of defence for a public log: IPs and anything shaped like a token or a secret.
          mask() { sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g; s/[A-Za-z0-9+\/_=|-]{32,}/<redacted>/g' | cut -c1-600; }
          out="$RUNNER_TEMP/whatsapp-2-server.txt"
          sleep 3
          on_server python3 - "$TAG" < .github/scripts/whatsapp-diagnostics/server-report.py 2>&1 | mask > "$out"
          rc=${PIPESTATUS[0]}
          echo >> "$out"
          # Runs on the server. The app id (not a secret) is the one value the bot container does not have.
          # shellcheck disable=SC2016
          in_bot_container='cd /opt/elevari || exit 1
            bot=$(docker compose -f docker-compose.prod.yml --env-file .env.production ps -q bot 2>/dev/null)
            [ -n "$bot" ] || { echo "== Meta check skipped: the bot container is not running"; exit 0; }
            app_id=$(sed -n "s/^META_APP_ID=//p" .env.production | tr -cd "0-9\n" | head -n 1)
            docker exec -i -e META_APP_ID="$app_id" "$bot" node -'
          on_server "$in_bot_container" < .github/scripts/whatsapp-diagnostics/meta-check.js 2>&1 | mask >> "$out"
          rm -f ~/.ssh/bot_key
          cat "$out"
          [ "$rc" -eq 0 ] || echo "::error::SSH step ended with exit code $rc"
          exit "$rc"

      - name: Put the report on the run's summary page
        if: ${{ always() }}
        run: |
          {
            echo '### WhatsApp bot'
            echo '```text'
            cat "$RUNNER_TEMP"/whatsapp-*.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
