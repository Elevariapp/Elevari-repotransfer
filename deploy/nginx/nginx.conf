worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 80M;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # Real client IP behind Cloudflare (rate limits and logs use it).
  include /etc/nginx/cloudflare-ips.conf;

  log_format main '$remote_addr - $request_method $scheme://$host$request_uri $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time id=$request_id';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Abuse protection (per real client IP). Cloudflare adds its own rules in front.
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Anything that is not an Elevari hostname is dropped (direct-IP scans).
  server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    server_name _;
    return 444;
  }

  # HTTP: health for local probes, everything else upgrades to HTTPS.
  server {
    listen 80;
    server_name elevari.live www.elevari.live media.elevari.live;

    location = /health {
      set $api_upstream http://api:4000;
      proxy_pass $api_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # www -> apex
  server {
    listen 443 ssl;
    http2 on;
    server_name www.elevari.live;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    return 301 https://elevari.live$request_uri;
  }

  # Public media (MinIO bucket is read-only for anonymous users).
  server {
    listen 443 ssl;
    http2 on;
    server_name media.elevari.live;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location /elevari-media/ {
      limit_except GET HEAD { deny all; }
      set $minio_upstream http://minio:9000;
      proxy_pass $minio_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host minio:9000;
      proxy_hide_header Set-Cookie;
      proxy_cache_bypass $http_pragma;
      add_header Cache-Control "public, max-age=86400" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location / {
      return 404;
    }
  }

  # Main site: web (Next.js) + API on the same hostname.
  server {
    listen 443 ssl;
    http2 on;
    server_name elevari.live;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Next.js sets its own security headers (CSP, nosniff, referrer, permissions); adding them here would duplicate them.
    # The API responses do not go through Next, so nosniff is added on the API locations below.

    location = /health {
      set $api_upstream http://api:4000;
      proxy_pass $api_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/v1/auth/ {
      set $api_upstream http://api:4000;
      add_header X-Content-Type-Options "nosniff" always;
      limit_req zone=auth_zone burst=10 nodelay;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
      set $api_upstream http://api:4000;
      add_header X-Content-Type-Options "nosniff" always;
      limit_req zone=api_zone burst=40 nodelay;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 120s;
    }

    location / {
      set $web_upstream http://web:3000;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
