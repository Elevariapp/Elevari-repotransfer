worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 80M;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # Basic abuse protection for the API (per client IP).
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

  server {
    listen 80;
    server_name _;

    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # —— Baseline security headers (OWASP) ——
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS is only honoured over HTTPS; safe to send when TLS terminates upstream.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    location = /health {
      set $api_upstream http://api:4000;
      proxy_pass $api_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/ {
      set $api_upstream http://api:4000;
      limit_req zone=api_zone burst=40 nodelay;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 120s;
    }

    location / {
      set $web_upstream http://web:3000;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
