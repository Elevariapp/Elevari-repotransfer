worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 80M;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # Basic abuse protection for the API (per client IP).
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

  # Behind Cloudflare, $remote_addr would be the edge node shared by many visitors. Trust
  # CF-Connecting-IP only when the connection really comes from a Cloudflare range
  # (https://www.cloudflare.com/ips/), so the header can't be forged by hitting the origin.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  server {
    listen 80;
    server_name _;

    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # —— Baseline security headers (OWASP) ——
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS is only honoured over HTTPS; safe to send when TLS terminates upstream.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    location = /health {
      set $api_upstream http://api:4000;
      proxy_pass $api_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # WhatsApp bot (Meta Cloud API webhook + health). /chat is intentionally not exposed.
    location = /bot/health {
      set $bot_upstream http://bot:3001;
      proxy_pass $bot_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location = /webhook/whatsapp {
      set $bot_upstream http://bot:3001;
      proxy_pass $bot_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      set $api_upstream http://api:4000;
      limit_req zone=api_zone burst=40 nodelay;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 120s;
    }

    location / {
      set $web_upstream http://web:3000;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
